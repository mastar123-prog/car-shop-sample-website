<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Master Car Accessories</title>
    <link rel="stylesheet" href="style.css">
    <script type="module" src="https://unpkg.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Playwrite+US+Modern:wght@100..400&display=swap" rel="stylesheet">
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
</head>
<body>
    <nav class="navbar">
        <ul>
            <li><a href="index.htm"><ion-icon name="home-outline"></ion-icon> Home</a></li>
            <li><a href="gear.htm"><ion-icon name="pricetags-outline"></ion-icon> Prices</a></li>
            <li><a href="shipping.htm"><ion-icon name="rocket-outline"></ion-icon> Shipping</a></li>
            <li><a href="works.htm"><ion-icon name="construct-outline"></ion-icon> How It Works</a></li>
            <li><a href="tech.htm"><ion-icon name="flash-outline"></ion-icon> Tech Gear</a></li>
            <li><a href="contact.htm"><ion-icon name="mail-outline"></ion-icon> Contact</a></li>
            <li><a href="user.htm"><ion-icon name="person-circle-outline"></ion-icon> Log In</a></li>
            <li><a href="register.htm"><ion-icon name="person-add-outline"></ion-icon> Register</a></li>
            <li><a href="order.htm"><ion-icon name="cart-outline"></ion-icon> Order</a></li>
            <li><a href="Get-a-new-password.htm"><ion-icon name="key-outline"></ion-icon> Reset</a></li>
        </ul>
    </nav>

    <div class="container">
        <div class="card">
            <h1>Contact Us</h1>
            <form action="https://api.web3forms.com/submit" method="POST">
                
                <!-- 1. PASTE YOUR KEY HERE -->
                <input type="hidden" name="access_key" value="YOUR_ACCESS_KEY_HERE">
                
                <!-- 2. SPAM PROTECTION -->
                <input type="checkbox" name="botcheck" style="display: none;">

                <div class="group">
                    <label>Name</label>
                    <input type="text" name="name" required placeholder="Your Name">
                </div>

                <div class="group">
                    <label>Email</label>
                    <input type="email" name="email" required placeholder="email@example.com">
                </div>

                <div class="group">
                    <label>Message</label>
                    <textarea name="message" required rows="5"></textarea>
                </div>
                <div class="h-captcha" data-captcha="true" data-theme="dark"></div>
                <button type="submit" class="btn">Send Message</button>
            </form>
        </div>
    </div>
    <script src="https://web3forms.com/client/script.js" async defer></script>
</body>
</html>
