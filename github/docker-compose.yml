version: '3.8'

services:
  # This is your Python app (Gunicorn)
  web:
    build: .
    expose:
      - "8000"
    restart: always

  # This is your NGINX Reverse Proxy
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
    restart: always
